[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "word_diff"
version = "1.1.0"
description = "AI Word 版本比较：比较两份 .docx 文档的新增/删除/修改差异，输出结构化 JSON 与中文摘要。"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Agent Module Dev" }]
keywords = ["word", "docx", "diff", "python-docx", "agent", "skill"]
dependencies = [
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
word_diff = "word_diff.cli:main"
word_diff_advanced = "word_diff.advanced:main"

[tool.setuptools]
# 入口脚本 word_diff.py / word_diff_advanced.py 放在项目根，随包分发
py-modules = ["word_diff", "word_diff_advanced"]
packages = ["word_diff"]
